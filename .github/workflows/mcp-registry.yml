name: Publish to MCP Registry
# Manual only: publishes server.json (the hosted server at https://schwankiapp.com/mcp)
# to registry.modelcontextprotocol.io. Bump "version" in server.json before each publish.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC login for the io.github.La-Salida namespace
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install mcp-publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo modelcontextprotocol/registry --pattern 'mcp-publisher_linux_amd64.tar.gz' --output mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
